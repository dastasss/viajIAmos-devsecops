# Secret de ejemplo. NUNCA versionar llaves reales: en producción la inyecta
# el pipeline (GitLab CI / GCP Secret Manager) o se crea manualmente:
#   kubectl create secret generic ai-secret \
#     --from-literal=ai-api-key='<llave>' -n viajiamos
apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: viajiamos
type: Opaque
stringData:
  ai-api-key: "cambiar-en-produccion"