name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/viajiamos

jobs:
  # ── STAGE 1: TEST ──────────────────────────────────────────────────────
  test:
    name: test-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, booking-service, payment-service, driver-service, realtime-service, ai-service]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements-dev.txt
      - name: Tests unitarios (pytest)
        working-directory: services/${{ matrix.service }}
        run: pytest -q --disable-warnings

  # ── STAGE 2: SECURITY (DevSecOps) ──────────────────────────────────────
  security-secrets:
    name: gitleaks (secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Escanear secretos en el repo
        run: gitleaks detect --source . --no-banner --exit-code 1

  security-sast:
    name: bandit-${{ matrix.service }} (SAST)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, booking-service, payment-service, driver-service, realtime-service, ai-service]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Instalar Bandit
        run: pip install bandit
      - name: Análisis estático
        working-directory: services/${{ matrix.service }}
        run: bandit -r app -f json -o bandit-report.json || true
      - name: Subir reporte (artefacto)
        uses: actions/upload-artifact@v5
        with:
          name: bandit-${{ matrix.service }}
          path: services/${{ matrix.service }}/bandit-report.json

  security-deps:
    name: pip-audit (dependencias)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, booking-service, payment-service, driver-service, realtime-service, ai-service]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Auditoría de dependencias
        working-directory: services/${{ matrix.service }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on

  # ── STAGE 3: BUILD + IMAGE SCAN ────────────────────────────────────────
  build:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, security-secrets, security-sast, security-deps]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, booking-service, payment-service, driver-service, realtime-service, ai-service]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (multi-stage, cache de capas)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escaneo de imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ── STAGE 4: INTEGRATION (docker compose + smoke test) ─────────────────
  integration:
    name: integración end-to-end
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Levantar stack local
        run: |
          docker compose up -d --build
          docker compose ps
      - name: Smoke test end-to-end
        run: python tests/smoke_test.py

  # ── STAGE 5: DEPLOY (Fase 2: GKE) ──────────────────────────────────────
  deploy-dry-run:
    name: validación manifiestos K8s
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v5
      - name: Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
      - name: Render + validar kustomize
        run: |
          kubectl kustomize k8s/ > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml

  deploy-gke:
    name: deploy a GKE (manual, Fase 2)
    runs-on: ubuntu-latest
    needs: [build, deploy-dry-run]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: gke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Conectar a GKE
        run: |
          gcloud container clusters get-credentials ${{ vars.GKE_CLUSTER }} \
            --region ${{ vars.GKE_REGION }} --project ${{ vars.GCP_PROJECT_ID }}
      - name: Reescribir imágenes + aplicar
        run: |
          kubectl kustomize k8s/ | sed "s|:latest|:${{ github.sha }}|g" | kubectl apply -f -
          kubectl rollout status deployment -n viajiamos --timeout=300s
